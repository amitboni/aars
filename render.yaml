databases:
  - name: aars-db
    plan: free
    databaseName: aars
    user: aars

services:
  - type: web
    name: aars-api
    runtime: python
    plan: free
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aars-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: CELERY_BROKER_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://aars-dashboard.netlify.app"]'
      - key: PYTHON_VERSION
        value: "3.12.3"
