[project]
name = "aars"
version = "0.1.0"
description = "Agent Activation & Retention System"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    # Database — BOTH async and sync drivers
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    # Cache & Queue
    "redis>=5.0.0",
    "celery[redis]>=5.3.0",
    # Auth
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # File processing
    "openpyxl>=3.1.0",
    # Storage
    "boto3>=1.34.0",
    # HTTP client
    "httpx>=0.26.0",
    # Encryption
    "cryptography>=41.0.0",
    # Utilities
    "python-dateutil>=2.8.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "core*", "modules*", "api*", "tasks*", "seeds*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
